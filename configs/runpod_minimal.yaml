# ============================================================
# MIMO-Diffusion-Gaussian
# Minimal RunPod configuration
# ============================================================


# ============================================================
# Channel model
# ============================================================

channel: rayleigh

Nr: 2
Nt: 1
K: 16
Nu: 1

# Number of channel symbols / time steps used by the full system.
T: 24

# Code-rate / bandwidth-related configuration.
cbr: 0.5555


# ============================================================
# SNR evaluation
# ============================================================

snr_db_range: [0, 10, 20]


# ============================================================
# Encoder / decoder
# ============================================================

embed_dim: 32

depths: [1, 1, 2, 1]
num_heads: [2, 4, 8, 16]

dec_depths: [1, 2, 1, 1]
dec_num_heads: [16, 8, 4, 2]

patch_size: 4
power: 1.0


# ============================================================
# Main encoder/decoder training
# ============================================================

data_root: data/mnist256/all

epochs: 5
batch_size: 16
lr: 1.0e-4


# ============================================================
# Channel score network
#
# The current ChannelScoreNet is an epsilon-prediction model:
#
#     H_sigma = H_0 + sigma * epsilon
#
#     network(H_sigma, sigma) ~= -epsilon
#
# and therefore:
#
#     score(H_sigma, sigma)
#         = network(H_sigma, sigma) / sigma
#
# ============================================================

channel_J: 50

sigma_H_1: 0.01
sigma_H_J: 10.0

channel_hidden_dim: 1024
channel_num_layers: 8
channel_time_dim: 512

score_lr: 2.0e-4
score_lr_min: 1.0e-5
score_weight_decay: 1.0e-4

score_epochs: 500
score_batch_size: 128

# Number of Rayleigh channel samples generated per epoch.
# 2560 / 128 = 20 optimizer steps per epoch.
score_samples_per_epoch: 2560


# ============================================================
# Temporal channel configuration
# ============================================================

alpha: 0.7
time_steps: 50
use_temporal_context: true


# ============================================================
# PVD inference
# ============================================================

J: 5
J_in: 3
L: 1

sigma_D_1: 0.01
sigma_D_J: 10.0